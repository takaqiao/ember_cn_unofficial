name: Release

# 与 crucible-cn 的流程同构，只有 tag 形态不同：
# ember_cn 的 module.json download 用的是 `v` 前缀（v1.1.0），crucible-cn 不带前缀。
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read tag version
        id: version
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"          # module.json 里存的是不带 v 的版本号
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify module.json version matches tag
        run: |
          MJ_VERSION=$(jq -r .version module.json)
          if [ "$MJ_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::module.json version ($MJ_VERSION) != tag (${{ steps.version.outputs.version }})"
            exit 1
          fi
          echo "module.json version matches tag: $MJ_VERSION"

      - name: Verify download URL points to this tag
        run: |
          DOWNLOAD=$(jq -r .download module.json)
          EXPECTED=".*/releases/download/${{ steps.version.outputs.tag }}/module.zip"
          if ! echo "$DOWNLOAD" | grep -qE "$EXPECTED"; then
            echo "::error::module.json download URL ($DOWNLOAD) does not match expected pattern $EXPECTED"
            exit 1
          fi
          echo "download URL ok: $DOWNLOAD"

      - name: Build module.zip
        run: |
          # compendium/en 是**英文基准**（22 MB），只用于算 drift，绝不能进发布包 ——
          # 装进去会让用户每次开世界白下一倍体积。
          # zip 对已存在的同名档案是**追加更新**、不是重建。仓库里若留着上一版的
          # module.zip，旧内容会原样活到新包里 —— 1.1.0 就这么混进了 22 MB 陈旧副本
          # （含那份损坏的 ember.crucible-adventure-en.json）。先删干净再打。
          # lang/en.json 是 lang_gap.py 的**旧版英文基准**（进 git，不进包）。
          # module.json 的 languages 里已不再声明它 —— 声明了等于用一份冻结快照覆盖
          # Ember 自己的英文串，Ember 一升级就是静默过期覆盖。
          # *.py 是仓库里的维护脚本（normalize_adventure_translation.py），运行时用不到。
          rm -f module.zip
          zip -r module.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x "release/*" \
            -x "lang/lang_keep_english.json" \
            -x "lang/en.json" \
            -x "compendium/en/*" \
            -x "*.py" \
            -x "scripts/__pycache__/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x "*.zip" \
            -x "*.bak" \
            -x ".DS_Store" \
            -x "Thumbs.db"
          ls -la module.zip
          echo "--- 确认英文基准没被打进去（应无输出）---"
          # 用 `unzip -Z1`（只列成员名）而不是 `unzip -l`：后者带一行 `Archive:  module.zip`
          # 表头，任何匹配 `.zip` 的模式都会打在自己的表头上。crucible 侧补这条断言时
          # 就是这么挂的，这里一并换成只列名的形式，并把排除面补齐到与 -x 清单同步。
          unzip -Z1 module.zip | grep -E "^compendium/en/|^lang/en\.json|lang_keep_english\.json|^scripts/|^release/|\.py$|\.zip$" && exit 1 || true
          unzip -l module.zip | tail -10

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          body_path: .github/release-body-template.md
          fail_on_unmatched_files: true
          files: |
            module.json
            module.zip
